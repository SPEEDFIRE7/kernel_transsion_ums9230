name: Backport BPF to kernel 5.4

# Put this file in: .github/workflows/backport-bpf.yml
# Defaults below are set for:
#   https://github.com/SPEEDFIRE7/kernel_transsion_ums9230  (branch: master)
# Source of backported commits (default): Android Common Kernel
#   https://android.googlesource.com/kernel/common
# Required BPF config reference (Google):
#   https://android.googlesource.com/kernel/configs

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Your kernel repo URL"
        required: true
        default: "https://github.com/SPEEDFIRE7/kernel_transsion_ums9230"
      kernel_branch:
        description: "Your kernel branch"
        required: true
        default: "master"
      source_repo:
        description: "Repo to take BPF commits from"
        required: true
        default: "https://android.googlesource.com/kernel/common"
      source_branch:
        description: "Branch in source repo (e.g. android12-5.10, android13-5.15)"
        required: true
        default: "android12-5.10"
      commits:
        description: "Commit SHAs to cherry-pick, oldest first, space separated (empty = only analyze)"
        required: false
        default: ""
      defconfig:
        description: "Device defconfig (file in arch/arm64/configs)"
        required: true
        default: "bg6_defconfig"
      build_kernel:
        description: "Build the kernel after config/backport"
        type: boolean
        default: false

jobs:
  backport:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git clang lld llvm bc bison flex libssl-dev \
            libelf-dev make gcc-aarch64-linux-gnu python3 cpio xz-utils \
            device-tree-compiler

      - name: Clone your kernel (with submodules, e.g. KernelSU)
        run: |
          git clone --branch "${{ inputs.kernel_branch }}" "${{ inputs.kernel_repo }}" kernel
          cd kernel
          git config user.name  "bpf-backport"
          git config user.email "bpf-backport@example.com"
          git submodule update --init --recursive --depth 1 || echo "submodule init failed (continuing)"
          make -s kernelversion || true

      - name: Fetch source branch (history, no blobs)
        working-directory: kernel
        run: |
          git remote add src "${{ inputs.source_repo }}"
          git fetch --filter=blob:none src "${{ inputs.source_branch }}"

      - name: Generate base config
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 LLVM=1 "${{ inputs.defconfig }}"
          cp out/.config ../config-before.txt

      - name: Apply BPF config fragment and report what really took effect
        working-directory: kernel
        run: |
          cat > ../bpf.fragment <<'EOF'
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NET_SCHED=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_SCH_INGRESS=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          CONFIG_BPF_STREAM_PARSER=y
          # CONFIG_BPFILTER is not set
          EOF
          sed -i 's/^ *//' ../bpf.fragment
          ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config ../bpf.fragment
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          cp out/.config ../config-after.txt
          : > ../config-report.txt
          for o in BPF BPF_SYSCALL BPF_JIT BPF_JIT_ALWAYS_ON BPF_EVENTS CGROUP_BPF \
                   NET_SCHED NET_CLS_ACT NET_SCH_INGRESS NET_CLS_BPF NET_ACT_BPF \
                   NETFILTER_XT_MATCH_BPF BPF_STREAM_PARSER; do
            if grep -q "^CONFIG_${o}=[ym]" out/.config; then
              was=$(grep -q "^CONFIG_${o}=[ym]" ../config-before.txt && echo "already-on" || echo "NEWLY-ENABLED")
              echo "OK       CONFIG_${o} ($was)" >> ../config-report.txt
            else
              echo "FAILED   CONFIG_${o} (missing dependency or not supported by this kernel -> needs backport)" >> ../config-report.txt
            fi
          done
          diff <(sort ../config-before.txt) <(sort ../config-after.txt) > ../config-diff.txt || true
          cat ../config-report.txt

      - name: List candidate BPF commits (touching kernel/bpf, filter.c)
        working-directory: kernel
        run: |
          base=$(git merge-base HEAD FETCH_HEAD || true)
          if [ -n "$base" ]; then
            git log --oneline --no-merges "$base"..FETCH_HEAD -- \
              kernel/bpf include/linux/bpf.h include/uapi/linux/bpf.h \
              net/core/filter.c tools/lib/bpf > ../candidates.txt || true
          else
            echo "No common ancestor found; list candidates manually from source repo." > ../candidates.txt
          fi
          wc -l ../candidates.txt

      - name: Cherry-pick selected commits
        if: ${{ inputs.commits != '' }}
        working-directory: kernel
        run: |
          : > ../backport-report.txt
          for c in ${{ inputs.commits }}; do
            if git cherry-pick -x "$c"; then
              echo "OK        $c" >> ../backport-report.txt
            else
              echo "CONFLICT  $c (skipped, fix by hand)" >> ../backport-report.txt
              git cherry-pick --abort || true
            fi
          done
          cat ../backport-report.txt
          mkdir -p ../patches
          git format-patch -o ../patches "origin/${{ inputs.kernel_branch }}..HEAD" || true

      - name: Build kernel (optional)
        if: ${{ inputs.build_kernel }}
        working-directory: kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee ../build.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpf-backport-results
          path: |
            config-report.txt
            config-diff.txt
            config-before.txt
            config-after.txt
            bpf.fragment
            candidates.txt
            backport-report.txt
            build.log
            patches/
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: ignore
